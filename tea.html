<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Tea Concept</title>
    <style>
        :root {
            --soft-pink: #fce4ec;
            --warm-orange: #ffab91;
            --gold: #d4af37;
            --deep-text: #4e342e;
        }

        body { 
            margin: 0; font-family: 'Georgia', serif; 
            background-color: #fffaf0; color: var(--deep-text); 
        }

        /* HERO SECTION */
        header {
            height: 80vh;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('https://images.unsplash.com/photo-1594631252845-29fc45865157?auto=format&fit=crop&q=80&w=1200');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        header h1 { font-size: 3.5rem; margin-bottom: 10px; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
        
        .btn {
            background-color: var(--gold);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        /* PRODUCT SECTION */
        .container { padding: 50px 20px; text-align: center; }
        
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            width: 250px;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 1px solid var(--soft-pink);
        }

        .product-card img { width: 100%; border-radius: 10px; height: 200px; object-fit: cover; }
        .product-card h3 { color: var(--warm-orange); }
    h1 { 
    font-size: 3.5rem; 
    background: linear-gradient(to right, #ffab91, #d4af37); /* Pink to Gold gradient */
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
}</style>
</head>
<body>

    <header>
        <h1>Nüwa</h1>
        <p>Hormone-balancing tea blends for every phase.</p>
        <a href="#" class="btn">Explore the Collection</a>
    </header>

    <div class="container">
        <h2>The Ritual</h2>
        <div class="grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?auto=format&fit=crop&q=80&w=500" alt="Menstrual Phase">
                <h3>The Rest Phase</h3>
                <p>Soothing ginger and raspberry leaf.</p>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1515696431267-33263c78880c?auto=format&fit=crop&q=80&w=500" alt="Follicular Phase">
                <h3>The Bloom Phase</h3>
                <p>Nettle and oatstraw for energy.</p>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&q=80&w=500" alt="Luteal Phase">
                <h3>The Inner Fall</h3>
                <p>Dandelion root to reduce bloat.</p>
            </div>
        </div>
    </div>

</body>
</html>

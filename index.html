<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matteo's Space Portal</title>
    <style>
        /* 1. DARK MODE & SPACE DUST STYLING */
        body { 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* 2. MOBILE POLISH (Responsive Design) */
        h1 { color: #4cc9f0; text-shadow: 0 0 15px rgba(76, 201, 240, 0.5); font-size: 2rem; }
        
        #controls { margin: 20px 0; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 50px; display: inline-block; }
        
        input[type="date"] {
            background: #222; color: white; border: 1px solid #4cc9f0;
            padding: 8px; border-radius: 5px; cursor: pointer;
        }

        #space-card { 
            background: rgba(17, 17, 17, 0.9); 
            border: 1px solid #333; 
            padding: 20px; 
            border-radius: 20px; 
            max-width: 800px; 
            margin: 20px auto; 
            display: none;
            backdrop-filter: blur(5px); /* Frosty glass effect */
        }

        img { width: 100%; border-radius: 10px; margin-top: 15px; }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>

    <h1>🚀 Space Portal</h1>
    
    <div id="controls">
        <label>Travel to Date: </label>
        <input type="date" id="date-picker">
    </div>

    <div id="loading">Scanning deep space...</div>

    <div id="space-card">
        <h2 id="title"></h2>
        <img id="pic" src="" alt="NASA Pic">
        <p id="explanation"></p>
    </div>

    <script>
        const datePicker = document.getElementById('date-picker');
        
        // Set default date to today
        const today = new Date().toISOString().split('T')[0];
        datePicker.value = today;

        async function loadSpaceData(date = "") {
            const loading = document.getElementById('loading');
            const card = document.getElementById('space-card');
            
            loading.style.display = 'block';
            card.style.display = 'none';

            try {
                // The URL now adds the date parameter!
                const url = `https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&date=${date}`;
                const response = await fetch(url);
                const data = await response.json();

                document.getElementById('title').innerText = data.title;
                document.getElementById('pic').src = data.url;
                document.getElementById('explanation').innerText = data.explanation;
                
                loading.style.display = 'none';
                card.style.display = 'block';
            } catch (error) {
                loading.innerText = "Error: This sector of space is unreachable.";
            }
        }

        // Listen for date changes!
        datePicker.addEventListener('change', (e) => {
            loadSpaceData(e.target.value);
        });

        // Initial load
        loadSpaceData(today);
    </script>
</body>
</html>

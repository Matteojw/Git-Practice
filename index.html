<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matteo's Space Portal</title>
    <style>
        /* 1. DARK MODE & SPACE DUST STYLING */
        body { 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* 2. MOBILE POLISH (Responsive Design) */
        h1 { color: #4cc9f0; text-shadow: 0 0 15px rgba(76, 201, 240, 0.5); font-size: 2rem; }
        
        #controls { margin: 20px 0; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 50px; display: inline-block; }
        
        input[type="date"] {
            background: #222; color: white; border: 1px solid #4cc9f0;
            padding: 8px; border-radius: 5px; cursor: pointer;
        }

        #space-card { 
            background: rgba(17, 17, 17, 0.9); 
            border: 1px solid #333; 
            padding: 20px; 
            border-radius: 20px; 
            max-width: 800px; 
            margin: 20px auto; 
            display: none;
            backdrop-filter: blur(5px); /* Frosty glass effect */
        }

        img { width: 100%; border-radius: 10px; margin-top: 15px; }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>

    <h1>🚀 Space Portal</h1>
    
    <div id="controls">
        <label>Travel to Date: </label>
        <input type="date" id="date-picker">
    </div>

    <div id="loading">Scanning deep space...</div>

    <div id="space-card">
        <h2 id="title"></h2>
        <img id="pic" src="" alt="NASA Pic">
        <p id="explanation"></p>
    </div>

    <script>const datePicker = document.getElementById('date-picker');
const MY_KEY = 'PcT3xw1DZauNjp6QQjxW1yzw6vCaZdrfHw9N0KZt'; // <--- PUT YOUR KEY HERE

async function loadSpaceData(date = "") {
    const loading = document.getElementById('loading');
    const card = document.getElementById('space-card');
    const picContainer = document.getElementById('pic');
    
    loading.style.display = 'block';
    card.style.display = 'none';

    try {
        const url = `https://api.nasa.gov/planetary/apod?api_key=${MY_KEY}&date=${date}`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error('NASA is busy');
        
        const data = await response.json();

        document.getElementById('title').innerText = data.title;
        document.getElementById('explanation').innerText = data.explanation;

        // NEW: Check if it's a video or image
        if (data.media_type === 'video') {
            picContainer.style.display = 'none';
            loading.innerHTML = `Today is a video! <a href="${data.url}" target="_blank" style="color:#4cc9f0">Click here to watch it.</a>`;
        } else {
            picContainer.src = data.url;
            picContainer.style.display = 'block';
            loading.style.display = 'none';
            card.style.display = 'block';
        }
        
    } catch (error) {
        console.log(error);
        loading.innerText = "Connection lost. NASA might be at capacity. Try again in a minute!";
    }
}

datePicker.addEventListener('change', (e) => loadSpaceData(e.target.value));
loadSpaceData(datePicker.value);
    </script>
</body>
</html>
